[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Beveiligingsheaders voor alle pagina's
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Extra beveiliging voor het CMS-admin panel
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Redirects: oude dienst-URLs → nieuwe /activiteiten/[slug]/ structuur.
# Voorheen ging dit via /diensten/..., maar die pagina's bestaan niet meer
# (hernoemd naar /activiteiten/) — direct doorverwijzen i.p.v. via die
# inmiddels niet meer bestaande tussenstop (die zelf ook alweer naar hier
# doorverwees via astro.config.mjs).
[[redirects]]
  from = "/bachbloesemtherapie/"
  to = "/activiteiten/bachbloesemtherapie/"
  status = 301

[[redirects]]
  from = "/meditatie/"
  to = "/activiteiten/meditatie/"
  status = 301

[[redirects]]
  from = "/coaching/"
  to = "/activiteiten/coaching/"
  status = 301

[[redirects]]
  from = "/begeleiding-hsp/"
  to = "/activiteiten/begeleiding-hsp/"
  status = 301

[[redirects]]
  from = "/persoonlijke-groei/"
  to = "/activiteiten/"
  status = 301
